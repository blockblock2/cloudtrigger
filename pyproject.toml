[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudtrigger"
version = "0.3.0"
description = "Watch Scratch cloud variables and set cloud variables when they change"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "blockblock2" }]
dependencies = ["websocket-client>=1.6", "requests>=2.28"]
keywords = ["scratch", "cloud variables", "scratch.mit.edu"]

[project.urls]
Homepage = "https://github.com/blockblock2/cloudtrigger"
Issues = "https://github.com/blockblock2/cloudtrigger/issues"

[project.scripts]
cloudtrigger = "cloudtrigger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
