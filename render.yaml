# Render Blueprint for the daily Hangman bot (examples/hangman).
# One free service runs both games (English + Spanish) so it fits in Render's 750 free hours.
# New > Blueprint on render.com, pick this repo, then fill in PROJECT_ID.
services:
  - type: web
    name: daily-hangman
    runtime: python
    plan: free
    rootDir: examples/hangman
    buildCommand: pip install -r requirements.txt
    startCommand: python hangman_bot.py
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PROJECT_ID
        sync: false          # English game's project number
      - key: PROJECT_ID_ES
        sync: false          # Spanish game (Ahorcado) project number; leave empty to skip
      - key: PROJECT_ID_WORDLE
        sync: false          # Wordle project number; leave empty to skip
      - key: HANGMAN_SECRET
        generateValue: true  # random, made by Render; nobody (including you) needs to see it
      - key: ADMIN_KEY
        generateValue: true  # password for /admin (the "New word" buttons); copy it from Environment
      - key: HANGMAN_TZ
        value: America/New_York
      - key: PYTHON_VERSION
        value: 3.12.7
